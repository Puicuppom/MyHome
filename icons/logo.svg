<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#9a80ff"/><stop offset=".55" stop-color="#6a4cf0"/><stop offset="1" stop-color="#3f2bbf"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1e1470" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f6b"/><stop offset="1" stop-color="#e5533d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#d9d3ff"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#4b33d1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3fe0"/><stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5b52e"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#8ef0a8"/><stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1b0f6b" flood-opacity=".45"/>
    </filter>
    <filter id="sh2" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1b0f6b" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7a1f10" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- badge -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#rim)" stroke-width="14"/>
  <ellipse cx="200" cy="118" rx="170" ry="78" fill="#fff" opacity=".10"/>

  <g transform="translate(256 0) scale(.94) translate(-256 -10)">
  <g filter="url(#sh)">
    <!-- chimney -->
    <rect x="324" y="112" width="36" height="74" rx="6" fill="#d9483a"/>
    <rect x="318" y="104" width="48" height="16" rx="6" fill="#ffd36b"/>
    <!-- wall -->
    <path d="M132 226 256 128l124 98v114a18 18 0 0 1-18 18H150a18 18 0 0 1-18-18z" fill="url(#wall)"/>
  </g>
  <!-- roof with eaves -->
  <g filter="url(#soft)">
    <path d="M84 222 256 86l172 136a14 14 0 0 1-17 22L256 122 101 244a14 14 0 0 1-17-22z" fill="url(#roof)"/>
  </g>
  <path d="M96 222 256 96" stroke="#ffd2c2" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <!-- attic window -->
  <circle cx="256" cy="186" r="20" fill="url(#win)" stroke="#c9c0ff" stroke-width="4"/>
  <path d="M256 168v36M238 186h36" stroke="#c9c0ff" stroke-width="4"/>
  <!-- window with chart -->
  <rect x="158" y="234" width="130" height="96" rx="14" fill="url(#win)" stroke="#c9c0ff" stroke-width="4"/>
  <path d="M176 308l30-26 22 16 38-38" fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="268" cy="258" r="11" fill="url(#dot)" stroke="#fff" stroke-width="3"/>
  <!-- door -->
  <path d="M308 358v-82a26 26 0 0 1 52 0v82z" fill="url(#door)"/>
  <circle cx="348" cy="320" r="5" fill="#ffd36b"/>
  <!-- step -->
  <rect x="298" y="354" width="72" height="10" rx="5" fill="#c9c0ff"/>

  </g>
  <!-- TAX pill -->
  <g filter="url(#sh2)">
    <rect x="118" y="356" width="276" height="98" rx="49" fill="#fff"/>
    <rect x="126" y="364" width="260" height="82" rx="41" fill="url(#pill)"/>
  </g>
  <rect x="134" y="368" width="244" height="30" rx="15" fill="#fff" opacity=".4"/>
  <text x="256" y="430" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="74" letter-spacing="6" fill="#2a1a8f" stroke="#2a1a8f" stroke-width="2">TAX</text>
</svg>
