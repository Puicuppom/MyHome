<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#9a80ff"/><stop offset=".55" stop-color="#6a4cf0"/><stop offset="1" stop-color="#3f2bbf"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1e1470" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f6b"/><stop offset="1" stop-color="#e5533d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#d9d3ff"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#4b33d1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3fe0"/><stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5b52e"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#8ef0a8"/><stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1b0f6b" flood-opacity=".45"/>
    </filter>
    <filter id="sh2" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1b0f6b" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7a1f10" flood-opacity=".35"/>
    </filter>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e09a12"/><stop offset="1" stop-color="#b8740a"/></linearGradient>
  </defs>
  <!-- badge -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#rim)" stroke-width="14"/>
  <ellipse cx="200" cy="118" rx="170" ry="78" fill="#fff" opacity=".10"/>

  <g transform="translate(0 14)">
  <g filter="url(#sh)">
    <rect x="330" y="104" width="38" height="80" rx="6" fill="#d9483a"/>
    <rect x="324" y="96" width="50" height="16" rx="6" fill="#ffd36b"/>
    <path d="M118 226 256 118l138 108v158a18 18 0 0 1-18 18H136a18 18 0 0 1-18-18z" fill="url(#wall)"/>
  </g>
  <g filter="url(#soft)">
    <path d="M68 222 256 74l188 148a15 15 0 0 1-18 24L256 112 86 246a15 15 0 0 1-18-24z" fill="url(#roof)"/>
  </g>
  <path d="M82 220 256 84" stroke="#ffd2c2" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <circle cx="256" cy="178" r="20" fill="url(#win)" stroke="#c9c0ff" stroke-width="4"/>
  <path d="M256 160v36M238 178h36" stroke="#c9c0ff" stroke-width="4"/>
  <rect x="150" y="222" width="140" height="70" rx="12" fill="url(#win)" stroke="#c9c0ff" stroke-width="4"/>
  <path d="M168 276l30-22 22 12 40-30" fill="none" stroke="url(#line)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="262" cy="236" r="10" fill="url(#dot)" stroke="#fff" stroke-width="3"/>
  <path d="M312 402v-148a28 28 0 0 1 56 0v148z" fill="url(#door)"/>
  </g>

  <!-- TAX ribbon across the house front -->
  <g filter="url(#sh2)">
    <path d="M58 334h62v80H58l22-40z" fill="url(#tail)"/>
    <path d="M454 334h-62v80h62l-22-40z" fill="url(#tail)"/>
    <path d="M100 414l20 16v-16z M412 414l-20 16v-16z" fill="#8a5606"/>
    <rect x="96" y="314" width="320" height="100" rx="10" fill="#fff"/>
    <rect x="104" y="322" width="304" height="84" rx="6" fill="url(#pill)"/>
  </g>
  <rect x="110" y="326" width="292" height="26" rx="6" fill="#fff" opacity=".4"/>
  <text x="256" y="390" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="78" letter-spacing="8" fill="#2a1a8f" stroke="#2a1a8f" stroke-width="2">TAX</text>
</svg>
